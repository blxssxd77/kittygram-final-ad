{% extends 'base.html' %}

{% block title %}{{ title }} — TeamFinder{% endblock %}

{% block content %}
<section class="form-page">
    <h1>{{ title }}</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <span class="form-error">{{ field.errors.0 }}</span>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">{{ submit_label }}</button>
    </form>
</section>
{% endblock %}
